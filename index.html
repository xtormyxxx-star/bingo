<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디지털 디톡스 빙고 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ea; --card:#fffdf7; --ink:#3b3426; --muted:#7d735f; --line:#e7dfcd;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --green:#4f8a2f; --green-soft:#eef5e6; --pink:#dc4d5c; --sun:#f2b632; --sun-soft:#fff4d6;
  /* 빙고판 한 변: 화면 높이에 맞추되 너무 작아지면 스크롤 */
  --head:195px;
  --bsize:min(100%, max(320px, calc(100dvh - var(--head))));
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-y:auto}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;
  padding:clamp(10px,2vh,20px) clamp(10px,2vw,24px) 28px;min-height:100dvh}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,36px);margin:0;color:var(--green);line-height:1.15}
h1 small{display:block;font-family:var(--body);font-size:clamp(13px,1.2vw,16px);color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ghost,.tools select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}
.btn{font-family:var(--display);font-size:20px;border:0;border-radius:14px;padding:10px 22px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 3px 0 #3a6922}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a6922}
.btn.sun{background:var(--sun);color:#4a3606;box-shadow:0 3px 0 #c48d12}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.confirm[hidden]{display:none}

/* 레이아웃 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,2vw,24px);align-items:start;justify-items:center}
.col{width:var(--bsize);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-height:38px}
.bar h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.8vw,24px);margin:0}
.bar .info{font-size:14px;color:var(--muted)}
body.play .stage{grid-template-columns:minmax(0,1fr)}
body.play{--head:190px}

/* 빙고판 */
.boardwrap{background:linear-gradient(#f3e6cc,#ead7b4);border:2px solid #dcc59b;border-radius:clamp(14px,2vw,24px);padding:clamp(6px,1.4%,14px)}
.board,.pool{container-type:inline-size;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,1.3cqi,12px)}
.board{gap:clamp(4px,1vw,10px)}
.cell{aspect-ratio:1;border-radius:12%;border:2px dashed #cdb68a;background:rgba(255,253,247,.55);position:relative;display:flex;min-width:0;transition:background .2s,border-color .2s,transform .15s}
.cell.target{border-color:var(--green);background:var(--green-soft);transform:scale(1.03)}
.cell.filled{border-style:solid;border-color:#d8c8a6}

/* 카드: 글자 크기가 판 크기를 따라감 */
.card{width:100%;height:100%;min-width:0;background:#fff;border:2px solid var(--line);border-radius:11%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:5%;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;font:inherit;color:inherit;transition:background .25s,border-color .25s,box-shadow .2s}
.card .em{font-size:clamp(16px,5.2cqi,52px);line-height:1}
.card .tx{font-size:clamp(9px,2.45cqi,24px);line-height:1.3;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.card:hover{border-color:#cdbf9f}
.card.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(79,138,47,.3)}
.card.dragging{opacity:.3}
.ghostcard{position:fixed;pointer-events:none;z-index:50;transform:rotate(-3deg) scale(1.05);box-shadow:0 12px 24px rgba(59,52,38,.25)}
.ghostcard .em{font-size:var(--gem)}
.ghostcard .tx{font-size:var(--gtx)}

.pool{padding:4px;border-radius:16px;transition:background .2s;min-height:120px;align-content:start}
.pool.target{background:var(--green-soft)}
.pool .card{aspect-ratio:1}
.poolbtns{display:flex;gap:8px;flex-wrap:wrap}

/* 놀이 */
body.play .card{cursor:pointer;touch-action:manipulation}
.card.mark{background:var(--green-soft);border-color:#9cc77d}
.card.bloom{background:var(--sun-soft);border-color:var(--sun)}
.stamp{position:absolute;right:-6%;top:-6%;width:30%;aspect-ratio:1;pointer-events:none;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.stamp svg{width:100%;height:100%;display:block}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1)}}
.score{display:flex;align-items:center;gap:10px}
.score .big{font-family:var(--display);font-size:clamp(20px,2.2vw,28px);color:var(--green)}
.score .big small{font-size:.6em;color:var(--muted)}
.lines{display:flex;gap:5px}
.lines i{width:clamp(24px,2.4vw,32px);aspect-ratio:1;border-radius:50%;border:2px dashed #cdb68a;display:grid;place-items:center;background:#fff}
.lines i.f{border:2px solid var(--sun);background:var(--sun-soft)}
.lines i svg{width:82%;height:82%}
.btns{display:flex;gap:6px;flex-wrap:wrap}

/* 축하 */
.overlay{position:fixed;inset:0;background:rgba(59,52,38,.45);display:grid;place-items:center;z-index:60;padding:16px;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:var(--card);border-radius:26px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.modal h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,46px);margin:4px 0;color:var(--pink)}
.modal .sub{color:var(--muted);margin:0 0 16px}
.flowers{display:flex;justify-content:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.flowers span{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.flowers svg{width:52px;height:52px}
.seedlist{text-align:left;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 18px}
.seedlist div{background:var(--green-soft);border-radius:14px;padding:9px 12px;font-size:15px;line-height:1.45}
.seedlist div span{font-size:13px;color:var(--muted);display:block}
.seedlist h3{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:21px;color:var(--green);margin:4px 0 0}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 세로·좁은 화면: 위아래로 쌓고 스크롤 */
@media (max-width:900px), (orientation:portrait){
  .stage{grid-template-columns:minmax(0,1fr)}
  :root{--bsize:min(100%, max(300px, calc(100dvh - var(--head))))}
  body:not(.play) .col{width:100%;max-width:720px}
}
@media (max-width:520px){
  .seedlist{grid-template-columns:minmax(0,1fr)}
  .card{border-width:1.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>디지털 디톡스 빙고 정원<small id="sub"></small></h1>
    <div class="tools">
      <label for="goal">빙고 목표</label>
      <select id="goal"><option value="1">1줄</option><option value="2">2줄</option><option value="3">3줄</option><option value="4" selected>4줄</option><option value="5">5줄</option></select>
      <button class="ghost" id="clearBtn" type="button" hidden>씨앗 지우기</button>
      <span class="confirm" id="clearAsk" hidden>심은 씨앗을 모두 지울까요?
        <button class="ghost" id="clearYes" type="button">지우기</button>
        <button class="ghost" id="clearNo" type="button">취소</button></span>
      <button class="ghost" id="resetBtn" type="button">처음부터</button>
      <span class="confirm" id="resetAsk" hidden>빙고판을 모두 비울까요?
        <button class="ghost" id="resetYes" type="button">비우기</button>
        <button class="ghost" id="resetNo" type="button">취소</button></span>
    </div>
  </header>
  <div class="stage">
    <section class="col">
      <div class="bar" id="bar"></div>
      <div class="boardwrap"><div class="board" id="board"></div></div>
    </section>
    <section class="col" id="side"></section>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="flowers" id="mFlowers"></div>
    <h2 id="mTitle">빙고!</h2>
    <p class="sub" id="mSub"></p>
    <div class="seedlist" id="mList"></div>
    <div class="mbtns">
      <button class="btn" id="mKeep" type="button">계속하기</button>
      <button class="btn sun" id="mNew" type="button">새 판 만들기</button>
    </div>
  </div>
</div>

<script>
const CARDS=[
 {e:"🛏️",t:"침대에 누워 폰을 오래 봤어요",tip:"폰은 침대 말고 책상 위에 두어요."},
 {e:"⏰",t:"'5분만!' 했는데 30분이 지났어요",tip:"타이머를 맞추고, 울리면 바로 꺼요."},
 {e:"🔔",t:"알림이 오면 하던 일을 멈춰요",tip:"숙제할 때는 알림을 꺼 두어요."},
 {e:"📱",t:"짧은 영상을 끝없이 넘겨 봤어요",tip:"볼 영상 개수를 미리 정해요."},
 {e:"📚",t:"숙제하기 싫어서 폰부터 켰어요",tip:"숙제를 먼저 끝내고, 폰은 상으로 해요."},
 {e:"💬",t:"친구 답장 왔나 자꾸 확인해요",tip:"메시지는 정해 둔 시간에 한 번에 봐요."},
 {e:"🌙",t:"폰 보다가 늦게 잠들었어요",tip:"잠자기 30분 전에는 폰을 거실에 두어요."},
 {e:"😟",t:"폰을 끄고 나서 후회했어요",tip:"다음에는 시작하기 전에 끝낼 시간을 정해요."},
 {e:"💭",t:"폰을 내려놔도 폰 생각이 나요",tip:"폰을 다른 방에 두고 좋아하는 놀이를 해요."},
 {e:"🚽",t:"화장실에도 폰을 들고 가요",tip:"화장실에는 폰 없이 가요."},
 {e:"🍽️",t:"밥 먹을 때 영상을 꼭 틀어요",tip:"밥 먹을 때는 가족과 이야기를 나눠요."},
 {e:"🪫",t:"배터리가 적으면 불안해요",tip:"배터리가 없으면 잠깐 쉬어 가는 시간이에요."},
 {e:"👆",t:"괜히 폰을 켰다 껐다 해요",tip:"켜기 전에 '왜 켜지?' 하고 물어봐요."},
 {e:"🚶",t:"걸어가면서 폰을 봤어요",tip:"걸을 때는 폰을 주머니에, 눈은 앞으로!"},
 {e:"🎮",t:"게임하느라 할 일을 잊었어요",tip:"할 일을 메모해서 잘 보이는 곳에 붙여요."},
 {e:"😤",t:"그만하라는 말에 짜증 났어요",tip:"부모님과 폰 쓰는 시간을 함께 정해요."},
 {e:"🌅",t:"눈 뜨자마자 폰부터 찾아요",tip:"일어나면 기지개 켜고 물 한 잔 먼저!"},
 {e:"🙉",t:"폰 하다가 부르는 소리를 못 들었어요",tip:"누가 부르면 폰을 내려놓고 얼굴을 봐요."},
 {e:"📶",t:"와이파이가 안 되면 답답해요",tip:"와이파이가 없을 때 할 책·보드게임을 정해 둬요."},
 {e:"👀",t:"폰을 오래 봐서 눈이 아팠어요",tip:"20분마다 먼 곳을 20초 동안 바라봐요."},
 {e:"🤔",t:"폰이 없으면 뭘 할지 모르겠어요",tip:"'폰 없이 할 놀이 목록'을 만들어 둬요."},
 {e:"🗣️",t:"가족과 얘기할 때도 폰을 봐요",tip:"이야기할 때는 폰을 뒤집어 놓아요."},
 {e:"👫",t:"친구를 만나서도 폰만 봤어요",tip:"친구와 만나면 몸으로 하는 놀이를 해요."},
 {e:"🤕",t:"폰 때문에 목·손목이 아팠어요",tip:"폰은 눈높이로 들고, 틈틈이 스트레칭!"},
 {e:"😵‍💫",t:"폰 생각에 공부 집중이 안 돼요",tip:"공부할 때는 폰을 가방 속에 넣어 둬요."}
];
const LINES=(()=>{const L=[];for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));L.push([0,6,12,18,24],[4,8,12,16,20]);return L})();
const KEY="detox-bingo-garden-v2";
const fresh=g=>({phase:"setup",board:Array(25).fill(null),marks:Array(25).fill(false),goal:g,celebrated:0});
let S=fresh(4);
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.board)&&s.board.length===25)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
let sel=null;

const SPROUT=`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff" stroke="#9cc77d" stroke-width="2"/><path d="M20 31V18" stroke="#4f8a2f" stroke-width="3" stroke-linecap="round"/><path d="M20 22C13 22 10 17 10 13c6 0 10 4 10 9Z" fill="#78b24a"/><path d="M20 19c6 0 10-5 10-9-6 0-10 4-10 9Z" fill="#5f9c37"/></svg>`;
const FLOWER=(c="#dc4d5c")=>`<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="translate(20 20)">${[0,72,144,216,288].map(a=>`<ellipse rx="6.5" ry="10" cy="-9" fill="${c}" transform="rotate(${a})"/>`).join("")}<circle r="6" fill="#f2b632"/></g></svg>`;
const FCOL=["#dc4d5c","#e57f22","#6a4ea6","#2d68b8","#2f8f80"];

const cardHTML=(id,cls="",inner="")=>{const c=CARDS[id];return `<div class="card ${cls}" data-id="${id}"><span class="em">${c.e}</span><span class="tx">${c.t}</span>${inner}</div>`};
const doneLines=()=>LINES.filter(l=>l.every(i=>S.marks[i]));
const placedCount=()=>S.board.filter(v=>v!==null).length;

function render(){
  const play=S.phase==="play";
  document.body.classList.toggle("play",play);
  if(!play){$("clearAsk").hidden=true}
  $("clearBtn").hidden=!play||!$("clearAsk").hidden;
  const dl=doneLines(), bloom=new Set(dl.flat()), n=dl.length;
  $("sub").textContent=play?"나도 그런 적 있는 칸을 눌러 씨앗을 심고, 줄을 완성해 꽃을 피워요"
    :"카드를 끌어다 빙고판에 놓거나, 카드를 누른 뒤 칸을 누르세요";

  $("bar").innerHTML=play
    ?`<div class="score"><span class="big">${n}줄 <small>/ ${S.goal}줄</small></span>
        <span class="lines">${Array.from({length:S.goal},(_,k)=>`<i class="${k<n?"f":""}">${k<n?FLOWER(FCOL[k%5]):""}</i>`).join("")}</span></div>`
    :`<h2>나의 빙고판</h2><span class="info">${placedCount()} / 25칸</span>`;

  $("board").innerHTML=S.board.map((id,i)=>{
    if(id===null)return `<div class="cell" data-i="${i}"></div>`;
    let cls="",st="";
    if(play&&S.marks[i]){cls=bloom.has(i)?"bloom":"mark";st=`<span class="stamp">${bloom.has(i)?FLOWER(FCOL[i%5]):SPROUT}</span>`}
    if(sel&&sel.from==="cell"&&sel.idx===i)cls+=" sel";
    return `<div class="cell filled" data-i="${i}">${cardHTML(id,cls,st)}</div>`;
  }).join("");

  if(play){
    $("side").innerHTML="";$("side").hidden=true;
  }else renderPool();
}

function renderPool(){
  $("side").hidden=false;
  const on=new Set(S.board.filter(v=>v!==null));
  const rest=CARDS.map((_,i)=>i).filter(i=>!on.has(i));
  $("side").innerHTML=`<div class="bar"><h2>남은 카드</h2>
     <div class="poolbtns">${rest.length?`<button class="ghost" id="shuffle" type="button">남은 칸 자동 채우기</button>`:""}
</div></div>
   <div class="pool" id="pool">${rest.map(id=>cardHTML(id,sel&&sel.from==="pool"&&sel.id===id?"sel":"")).join("")}</div>`;
  if($("shuffle"))$("shuffle").onclick=()=>{
    const left=rest.slice().sort(()=>Math.random()-.5);
    S.board=S.board.map(v=>v===null?left.pop():v);sel=null;startPlay();
  };
}
function startPlay(){S.phase="play";S.marks=Array(25).fill(false);S.celebrated=0;sel=null;save();render();window.scrollTo({top:0,behavior:"smooth"})}

function toggleMark(i){
  if(S.board[i]===null)return;
  S.marks[i]=!S.marks[i];
  const n=doneLines().length;
  if(n<S.celebrated)S.celebrated=n;
  save();render();
  if(n>=S.goal&&S.celebrated<S.goal){S.celebrated=n;save();celebrate(n)}
}
function celebrate(n){
  $("mFlowers").innerHTML=Array.from({length:Math.max(n,3)},(_,k)=>`<span style="animation-delay:${k*.08}s">${FLOWER(FCOL[k%5])}</span>`).join("");
  $("mTitle").textContent=`빙고! ${n}줄 완성`;
  const m=S.board.filter((id,i)=>S.marks[i]);
  $("mSub").textContent=`씨앗 ${m.length}개를 심어 꽃이 피었어요. 이제 진짜 정원을 가꿔 볼까요?`;
  $("mList").innerHTML=`<h3>🌱 내가 심을 좋은 습관 씨앗</h3>`+m.map(id=>`<div><span>${CARDS[id].e} ${CARDS[id].t}</span>${CARDS[id].tip}</div>`).join("");
  $("overlay").hidden=false;$("mKeep").focus();
}
$("mKeep").onclick=()=>{$("overlay").hidden=true};
$("mNew").onclick=()=>{$("overlay").hidden=true;S=fresh(S.goal);sel=null;save();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").hidden=true});

/* 카드 옮기기 */
function moveTo(src,dest){
  const before=placedCount();
  if(dest.pool){if(src.from==="cell")S.board[src.idx]=null}
  else{
    const i=dest.cell;
    if(src.from==="pool")S.board[i]=src.id;
    else if(src.idx!==i){const t=S.board[i];S.board[i]=src.id;S.board[src.idx]=t}
  }
  sel=null;
  if(before<25&&placedCount()===25){startPlay();return}   // 마지막 카드를 놓으면 바로 빙고 시작
  save();render();
}
function srcOf(el){const id=+el.dataset.id,c=el.closest(".cell");return c?{from:"cell",id,idx:+c.dataset.i}:{from:"pool",id}}
function destAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const c=el.closest(".board .cell");if(c)return{cell:+c.dataset.i,el:c};
  const p=el.closest("#pool");if(p)return{pool:true,el:p};
  return null;
}
let drag=null;
document.addEventListener("pointerdown",e=>{
  if(S.phase!=="setup"||e.button>0)return;
  const card=e.target.closest(".card");if(!card)return;
  drag={src:srcOf(card),el:card,x:e.clientX,y:e.clientY,moving:false,ghost:null,hot:null};
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moving){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.moving=true;
    const r=drag.el.getBoundingClientRect(),cs=getComputedStyle(drag.el.querySelector(".tx")),ce=getComputedStyle(drag.el.querySelector(".em"));
    const g=drag.el.cloneNode(true);g.classList.add("ghostcard");g.classList.remove("sel");
    const cc=getComputedStyle(drag.el);
    g.style.width=r.width+"px";g.style.height=r.height+"px";
    g.style.padding=cc.padding;g.style.gap=cc.rowGap;g.style.borderRadius=cc.borderRadius;
    g.style.setProperty("--gtx",cs.fontSize);g.style.setProperty("--gem",ce.fontSize);
    drag.ox=r.width/2;drag.oy=r.height/2;
    document.body.appendChild(g);drag.ghost=g;drag.el.classList.add("dragging");
  }
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.ox)+"px";drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  // 화면 가장자리로 끌면 자동 스크롤
  const edge=60;
  if(e.clientY>innerHeight-edge)scrollBy(0,14);else if(e.clientY<edge)scrollBy(0,-14);
  const d=destAt(e.clientX,e.clientY);
  if(drag.hot&&(!d||d.el!==drag.hot)){drag.hot.classList.remove("target");drag.hot=null}
  if(d&&d.el!==drag.hot){d.el.classList.add("target");drag.hot=d.el}
},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;
  const dr=drag;drag=null;
  if(dr.ghost)dr.ghost.remove();
  if(dr.hot)dr.hot.classList.remove("target");
  dr.el.classList.remove("dragging");
  if(dr.moving){if(!cancel){const d=destAt(e.clientX,e.clientY);if(d)moveTo(dr.src,d)}return}
  if(cancel)return;
  const s=dr.src;
  if(sel&&sel.id===s.id){sel=null;render();return}
  if(sel&&s.from==="cell"){moveTo(sel,{cell:s.idx});return}
  sel=s;render();
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));
document.addEventListener("click",e=>{
  if(S.phase==="play"){const c=e.target.closest(".board .cell");if(c)toggleMark(+c.dataset.i);return}
  if(e.target.closest(".card"))return;
  const c=e.target.closest(".board .cell");
  if(c&&sel){moveTo(sel,{cell:+c.dataset.i});return}
  if(e.target.closest("#pool")&&sel&&sel.from==="cell")moveTo(sel,{pool:true});
});

if(S.phase==="setup"&&placedCount()===25)S.phase="play";
$("goal").value=String(S.goal);
$("goal").onchange=e=>{S.goal=+e.target.value;S.celebrated=Math.min(S.celebrated,doneLines().length>=S.goal?S.goal:0);save();render()};
$("clearBtn").onclick=()=>{$("clearAsk").hidden=false;$("clearBtn").hidden=true};
$("clearNo").onclick=()=>{$("clearAsk").hidden=true;$("clearBtn").hidden=false};
$("clearYes").onclick=()=>{S.marks=Array(25).fill(false);S.celebrated=0;save();$("clearAsk").hidden=true;render()};
$("resetBtn").onclick=()=>{$("resetAsk").hidden=false;$("resetBtn").hidden=true};
$("resetNo").onclick=()=>{$("resetAsk").hidden=true;$("resetBtn").hidden=false};
$("resetYes").onclick=()=>{S=fresh(S.goal);sel=null;save();$("resetAsk").hidden=true;$("resetBtn").hidden=false;render()};
render();
</script>
</body>
</html>
